name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every nixosConfiguration, homeConfiguration and deploy node
      # (catches syntax errors, missing inputs, type errors) without building.
      - name: Evaluate flake
        run: nix flake check --no-build

      # Cheap to build: fails if .sops.yaml was edited by hand or not
      # regenerated after an inventory change.
      - name: .sops.yaml is up to date
        run: nix build --no-link .#checks.x86_64-linux.sops-config

      - name: Formatting
        run: |
          nix fmt -- --check $(git ls-files '*.nix')
